name: Daily ETF Scraper

on:
  schedule:
  # 較晚的後備班次。cron 設 UTC 13:00,但 GitHub 排程是盡力而為、不是準點:
  # 實測 189 次 schedule 執行全部落在 UTC 14:21-16:25(台北 22:21 至隔日 00:25),
  # 比 cron 晚 1.5-3.5 小時。所以不要照字面把它當成「台灣時間 21:00」。
  #
  # 這個延遲對守衛無害:它只讓後備更晚於主觸發,而最晚的 16:25Z 仍落在同一個 UTC 日,
  # 守衛比對的 UTC 日期與 main.py 的請求日期因此仍然同步。日後要調 cron 時要預留
  # 這段延遲,別讓它有機會跨過 00:00Z——跨過去守衛就會比錯日期。
  # 主觸發是 Cloudflare Workers Cron (台 18:25 / UTC 10:25),此 schedule 萬一 Cloudflare 沒跑時補上。
  # 必須晚於主觸發跑完(約 10:30),否則早退守衛失效、後備會搶在主觸發前面。
    - cron: '0 13 * * *'
  workflow_dispatch:
  # 已移除 push 觸發(2026-08-05)。原本 push 到 main 會立即跑一次完整爬蟲,
  # 若 push 發生在盤中(投信當日 PCF 尚未發布),用請求日期的 scraper 會把前一日
  # 資料寫成當日;跑完 commit db 後,當晚主班次又會被早退守衛跳過,錯誤資料因而留存。
  # (2026-06-23 加守衛之前,這種誤寫還會被當晚排程覆蓋,加了守衛後才變成永久錯誤。)
  # 程式碼改動請用 workflow_dispatch 手動觸發,或等排程。

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 守衛已改查 db 內容,不再需要完整歷史(舊版用 git log 找 db 的 commit 日期)。
          # 這個 repo 每天 commit 一次 binary db,完整歷史的 clone 成本會一直長大,
          # 所以只取最後一個 commit;commit/push 用淺歷史即可。
          fetch-depth: 1

      # 早退守衛: 看「今天實際寫入過幾檔 ETF」(holdings.created_at),達門檻才跳過。
      #
      # 演進與理由:
      # 1. 最早看 db 檔案哪天被 commit(git log)。那只證明「今天寫過檔案」,不證明
      #    寫進去的是今天的資料。盤中執行時投信當日 PCF 尚未發布,用請求日期的
      #    scraper 會把前一日內容寫成當日,commit 後守衛即誤判當日已完成,
      #    把當晚真正該跑的班次跳掉,錯誤資料因而永久留存。
      # 2. 改看「資料日期是否等於今天」也不對。各家投信的資料日期天然不同步:
      #    當日 PCF 的發布時間各家不同,晚發布的要到收盤後才更新,盤中抓到的還是前一日。
      #    實測 2026-08-05 那天寫入了 15 檔,其中 4 檔(00403A/00404A/00408A/00994A)
      #    的資料日期是 08-04——用資料日期當判準會把這 4 檔算成「還沒跑」。
      # 3. 現在看 created_at: 那是寫入時間,與資料日期無關,才真正代表執行狀態。
      #    受防護的來源被擋下時整組不寫入,不會有新的 created_at,所以「來源還沒更新」
      #    會表現為未完成,當晚的後備班次就會再給來源一次機會。
      #
      #    created_at 的語意是「該列首次寫入時間」: insert_holdings 是 UPSERT 且
      #    衝突時不更新 created_at,所以「來源沒更新、重寫同一個資料日期」不會被
      #    算成今天有進度——WROTE 數的是「今天首次寫入的檔數」。這點在 2026-08-05
      #    把台新/安聯/群益/摩根轉成 source_dated(當時豁免 14/19;2026-08-09 新增
      #    兆豐/凱基/永豐三檔後為 17/22,都已過 70% 門檻)之後
      #    是守衛正確性的必要條件:若重寫會刷新 created_at,「全來源停更」的傍晚
      #    會誤達標而跳過後備班次,晚發布的來源那天就永久缺資料。
      #    (歷史備註:舊寫法 INSERT OR REPLACE 會刷新 created_at,當時豁免僅 8/19
      #    未達門檻所以無害;轉換與 UPSERT 必須一起上,單獨轉換會踩上述地雷。)
      #
      # 為什麼要用覆蓋率而不是「有沒有」: 主班次只要一檔成功就會讓「有資料」成立,
      # 其餘因逾時或改版失敗的檔便再也沒有後備班次去補。實測每個寫入日通常
      # 15-17/19 檔(79-89%),而 2026-08-05 若防護生效只會寫入約 8 檔(42%),
      # 門檻取 70% 能區分這兩種情況。分母(TOTAL)是動態查 etf_list,2026-08-09
      # 新增兆豐/凱基/永豐後變 22,門檻換算為需 >=16 檔——三家來源穩定且皆
      # source_dated,預期落在 18-20/22,但第一次跑完要確認一下有沒有壓到門檻。
      # 漏跑會讓資料永久缺一天,多跑只是多花幾分鐘
      # 且 commit 步驟有 git diff --quiet 擋空提交,所以門檻刻意偏保守。
      #
      # 時區: 用 UTC。main.py 各 daily_update_* 用 datetime.now() 決定請求日期,
      # 在 runner 上就是 UTC;sqlite 的 CURRENT_TIMESTAMP 也是 UTC。三者同基準,
      # 否則台北凌晨 0-8 點手動觸發時守衛比的是今天、寫進去的卻是昨天。
      - name: Skip if today's scrape already completed
        id: guard
        env:
          SKIP_COVERAGE_PCT: ${{ vars.SKIP_COVERAGE_PCT || '70' }}
        run: |
          TODAY=$(date -u +%F)
          # 單行 python: 多行寫法在 yaml 裡會帶前導空白而觸發 IndentationError。
          # 查詢失敗(檔案或表不存在)時輸出 0,結果是「不跳過」,寧可多跑一次也不漏跑。
          WROTE=$(python3 -c "import os,sqlite3,sys;p='data/etf_holdings.db';print(sqlite3.connect(p).execute('select count(distinct etf_code) from holdings where substr(created_at,1,10)=?',(sys.argv[1],)).fetchone()[0] if os.path.exists(p) else 0)" "$TODAY" 2>/dev/null || echo 0)
          TOTAL=$(python3 -c "import os,sqlite3;p='data/etf_holdings.db';print(sqlite3.connect(p).execute(\"select count(*) from etf_list where etf_code like '%A'\").fetchone()[0] if os.path.exists(p) else 0)" 2>/dev/null || echo 0)
          echo "今天($TODAY, UTC)已寫入=$WROTE/$TOTAL 檔 / 跳過門檻=${SKIP_COVERAGE_PCT}%"
          if [ "$TOTAL" -gt 0 ] && [ $((WROTE * 100)) -ge $((TOTAL * SKIP_COVERAGE_PCT)) ]; then
            echo "今天已完成足夠的抓取,跳過爬蟲"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run daily update (All ETFs)
        if: steps.guard.outputs.skip != 'true'
        run: |
          python main.py --all

      - name: Show database statistics
        if: steps.guard.outputs.skip != 'true'
        run: |
          python main.py --stats

      - name: Commit and push changes
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/etf_holdings.db
          git add reports/
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Update ETF holdings data - $(date +'%Y-%m-%d')" && git push)
