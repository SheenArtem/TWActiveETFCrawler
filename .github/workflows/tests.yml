name: Tests

# 為什麼要獨立一支 workflow:
# 抓取用的 daily-scraper.yml 已刻意移除 push 觸發(盤中跑會把前一日資料寫成當日),
# 移除之後改動程式碼就沒有任何 workflow 會跑,日期錯位防護的回歸只能靠人工記得跑。
# 這支只跑測試:不連投信網站、不碰 data/etf_holdings.db(測試自己開 temp DB),
# 所以可以安全地掛在每次 push / PR 上。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run date-misalignment guard regression suite
        run: python test_duplicate_guard.py

      - name: Verify market data and archive fixtures
        run: |
          node --test tests/market-data.test.mjs
          python scripts/render_report_pages.py --check

      - name: Check the mobile and desktop holdings explorer
        run: |
          if ! command -v google-chrome >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
          if [ -z "$(fc-list :lang=zh family)" ]; then
            sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          fi
          python tests/market_browser.py

      - name: Save the tested screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holdings-explorer-screens
          path: ui-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
